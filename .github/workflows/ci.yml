name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap gcc libc6-dev libseccomp2
      - run: python -m ruff check .
      - run: python -m coverage run -m pytest -q -rs
        env:
          THREAT_LAB_REQUIRE_BWRAP_PROBE: ${{ runner.os == 'Linux' && '1' || '0' }}
          THREAT_LAB_REQUIRE_APPCONTAINER_PROBE: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: python -m coverage report
      - run: python -m coverage json -o coverage.json
      - run: python scripts/check_coverage.py coverage.json
      - run: python -m build
      - run: python scripts/check_installed_package.py
