name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  verify:
    needs: cpython-reference
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap gcc libc6-dev libseccomp2
      - run: python -m ruff check .
      - uses: actions/download-artifact@v4
        with:
          name: bandit-reference-wheels
          path: ${{ runner.temp }}/bandit-reference
      - run: python -m coverage run -m pytest -q -rs --junitxml=pytest-results.xml
        env:
          THREAT_LAB_REFERENCE_WHEELS: ${{ format('{0}/bandit-reference', runner.temp) }}
          THREAT_LAB_REQUIRE_BWRAP_PROBE: ${{ runner.os == 'Linux' && '1' || '0' }}
          THREAT_LAB_REQUIRE_APPCONTAINER_PROBE: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: python -m coverage report
      - run: python -m coverage json -o coverage.json
      - run: python scripts/check_coverage.py coverage.json
      - run: python -m build
      - run: python scripts/check_installed_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            pytest-results.xml
            coverage.json
  cpython-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y bubblewrap gcc libc6-dev libseccomp2
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/fetch_bandit_reference_wheels.py "${{ runner.temp }}/bandit-reference"
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-reference-wheels
          path: ${{ runner.temp }}/bandit-reference
          if-no-files-found: error
          retention-days: 1
      - run: python scripts/fetch_cpython_reference.py "${{ runner.temp }}/cpython-reference"
      - run: python -m pytest -qs tests/test_scanner_sandbox.py -k pinned_cpython
        env:
          THREAT_LAB_REFERENCE_WHEELS: ${{ runner.temp }}/bandit-reference
          THREAT_LAB_CPYTHON_OCI: ${{ runner.temp }}/cpython-reference
          THREAT_LAB_REQUIRE_BWRAP_PROBE: '1'
